[palette]
name = "Rhiannon Floral"
variant = "dark"
description = "Rose-charcoal florals in blush, peach, and sage"

[palette.colors]
night = "#29262b"
surface = "#353139"
raised = "#49434c"
cream = "#fff4ec"
muted = "#dfd1d5"
blush = "#f2c9d3"
peach = "#f5d2bd"
sage = "#cbd9bf"
lavender = "#ded5e4"
gold = "#d7b878"
border = "#675d65"
error = "#e896a0"

[palette.semantic]
