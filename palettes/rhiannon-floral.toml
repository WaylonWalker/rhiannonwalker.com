[palette]
name = "Rhiannon Floral"
variant = "dark"
description = "Moonlit florals — deep plum night with luminous pastel blooms"

[palette.colors]
night = "#231a25"
surface = "#2e2233"
raised = "#3b2d42"
cream = "#fdf2ec"
muted = "#c4b0bb"
blush = "#f2a5bf"
peach = "#f0b48e"
sage = "#a9d3ae"
lavender = "#c9b3ec"
gold = "#e8c87a"
border = "#4a3d52"
error = "#f1a3aa"

[palette.semantic]
