[palette]
name = "Rhiannon Floral"
variant = "dark"
description = "Midnight ink florals in blush, peach, sage, and lavender"

[palette.colors]
night = "#17191d"
surface = "#23262c"
raised = "#30343b"
cream = "#f7f1eb"
muted = "#cbc5ce"
blush = "#f2c7d7"
peach = "#f5d0bc"
sage = "#c9dccd"
lavender = "#dbd0eb"
gold = "#e3c88d"
border = "#55535c"
error = "#eea3aa"

[palette.semantic]
bg-primary = "night"
bg-secondary = "surface"
bg-surface = "surface"
bg-elevated = "raised"
text-primary = "cream"
text-secondary = "muted"
text-muted = "muted"
accent = "blush"
accent-hover = "peach"
link = "blush"
link-hover = "peach"
link-visited = "lavender"
success = "sage"
warning = "gold"
error = "error"
info = "lavender"
border = "border"
border-focus = "peach"

[palette.components]
nav-bg = "night"
nav-text = "cream"
nav-active = "blush"
card-bg = "surface"
card-border = "border"
code-bg = "raised"
code-text = "cream"
button-primary-bg = "blush"
button-primary-text = "night"
button-secondary-bg = "raised"
button-secondary-text = "cream"
