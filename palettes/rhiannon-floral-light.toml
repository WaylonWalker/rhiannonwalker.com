[palette]
name = "Rhiannon Floral Light"
variant = "light"
description = "Daylight florals in warm paper, blush, and sage"

[palette.colors]
paper = "#fffaf6"
surface = "#fff4f1"
raised = "#f5e7eb"
ink = "#30232f"
muted = "#685b66"
blush = "#a54d68"
peach = "#a85b43"
sage = "#4f6956"
lavender = "#66527e"
gold = "#83651f"
border = "#d7c5cc"
error = "#a7434a"

[palette.semantic]
bg-primary = "paper"
bg-secondary = "surface"
bg-surface = "surface"
bg-elevated = "raised"
text-primary = "ink"
text-secondary = "muted"
text-muted = "muted"
accent = "blush"
accent-hover = "peach"
link = "blush"
link-hover = "peach"
link-visited = "lavender"
success = "sage"
warning = "gold"
error = "error"
info = "lavender"
border = "border"
border-focus = "blush"

[palette.components]
nav-bg = "paper"
nav-text = "ink"
nav-active = "blush"
card-bg = "surface"
card-border = "border"
code-bg = "raised"
code-text = "ink"
button-primary-bg = "blush"
button-primary-text = "paper"
button-secondary-bg = "surface"
button-secondary-text = "ink"
