{% extends "post.html" %}

{% block body_class %}page-pins{% endblock %}
{% block page_wrapper_class %} page-wrapper--feed-only page-wrapper--pins{% endblock %}

{% block content %}
<section class="pins-page" aria-labelledby="pins-title">
  <header class="feed-header">
    <h1 id="pins-title" class="p-name">{{ post.title }}</h1>
    {% if post.description %}<p class="p-summary">{{ post.description }}</p>{% endif %}
  </header>
  <div class="pins-content">{{ body | safe }}</div>
</section>
{% endblock %}
