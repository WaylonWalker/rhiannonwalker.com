# markata-go configuration for rhiannonwalker.com.
# The legacy Python Markata configuration remains in markata.toml for
# migration reference. The new build uses the embedded default theme, with a
# site-specific post template to keep synthetic 404 metadata valid.

[markata-go]
title = "Rhiannon Walker"
description = "One Breath at a Time"
url = "https://rhiannonwalker.com"
author = "Rhiannon Walker"
author_url = "https://rhiannonwalker.com"
language = "en"
license = false
output_dir = "output"
assets_dir = "static"
templates_dir = "templates-go"
hooks = ["default"]

[markata-go.glob]
patterns = ["pages/**/*.md"]
use_gitignore = true

[markata-go.markdown]
extensions = ["tables", "strikethrough", "tasklist"]

[markata-go.layout]
name = "blog"

[markata-go.theme]
palette = "rhiannon-floral"
palette_light = "rhiannon-floral-light"
palette_dark = "rhiannon-floral"
fontpack = "literary"
custom_css = "custom.css"

[markata-go.theme.switcher]
enabled = false
mode_toggle = true

[markata-go.theme.variables]
"--content-width" = "68ch"

[markata-go.post_formats]
html = true
markdown = false
text = false
ansi = false
og = false

[[markata-go.nav]]
label = "Home"
url = "/"

[[markata-go.nav]]
label = "About"
url = "/about/"

[[markata-go.nav]]
label = "Archive"
url = "/archive/"

[[markata-go.nav]]
label = "Projects"
url = "/projects/"

[[markata-go.nav]]
label = "Portfolio"
url = "/portfolio/"

# Keep root subscriptions without letting the implicit HTML feed replace
# pages/index.md at /index.html.
[[markata-go.feeds]]
slug = ""
title = "Rhiannon Walker Feed"
description = "One Breath at a Time"
filter = "published == true"
sort = "date"
reverse = true

[markata-go.feeds.formats]
html = false
rss = true
atom = true

[[markata-go.feeds]]
slug = "archive"
title = "Archive"
description = "Rhiannon's writing"
filter = "published == true and slug != 'index' and slug != 'about' and not path.startswith('pages/daily/') and not path.startswith('pages/gratitude/') and not path.startswith('pages/shots/')"
sort = "date"
reverse = true
primary = true
items_per_page = 20
sidebar = true

[[markata-go.feeds]]
slug = "blog"
title = "Rhiannon's Life"
description = "Stories from Rhiannon's life"
filter = "published == true and path.startswith('pages/blog/') and slug != 'index' and slug != 'about'"
sort = "date"
reverse = true
primary = true
items_per_page = 20
sidebar = true

[[markata-go.feeds]]
slug = "projects"
title = "Projects"
description = "Quilting and other projects"
filter = "published == true and path.startswith('pages/project/')"
sort = "date"
reverse = true
primary = true
items_per_page = 20
sidebar = true

[[markata-go.feeds]]
slug = "shots"
title = "Shots"
filter = "published == true and path.startswith('pages/shots/')"
sort = "date"
reverse = true
primary = true
items_per_page = 20
sidebar = true

[markata-go.feeds.templates]
html = "feed-photo-grid.html"

[[markata-go.feeds]]
slug = "daily"
title = "Daily Notes"
description = "Day-to-day notes from Rhiannon"
filter = "published == true and 'daily-note' in tags"
sort = "date"
reverse = true
primary = true
items_per_page = 20
sidebar = true
include_private = true

[[markata-go.feeds]]
slug = "pins"
title = "Pins"
description = "Pinned links from around the web"
filter = "published == true and template == 'link'"
sort = "date"
reverse = true
primary = true
items_per_page = 20
sidebar = true

[markata-go.feeds.formats]
html = false
simple_html = false
rss = true
atom = true
json = true
sitemap = true

[markata-go.components.share]
enabled = false

[markata-go.encryption]
decryption_hint = "DM me for access"
# The portfolio password is short and memorable for sharing with clients,
# so strength enforcement is off. Keys are still required — this only
# skips the length/crack-time policy checks.
enforce_strength = false

[markata-go.encryption.private_tags]
"daily-note" = "default"
daily = "default"
gratitude = "default"

[markata-go.search]
backend = "bleve"
endpoint = "/api/search"

[markata-go.search.bleve]
fuzzy = false
limit = 20
max_limit = 100
cors_origins = ["*"]

[markata-go.seo]
default_image = "https://dropper.wayl.one/api/file/858c063f-d5ac-45bc-8c01-b347fb01becd.png"
author_image = "https://dropper.wayl.one/api/file/858c063f-d5ac-45bc-8c01-b347fb01becd.png"
og_image_service = "https://shots.wayl.one/shot/"

[markata-go.webmention]
enabled = true
endpoint = "https://webmention.io/rhiannonwalker.com/webmention"

[markata-go.indieauth]
enabled = true
authorization_endpoint = "https://indieauth.com/auth"
token_endpoint = "https://tokens.indieauth.com/token"

[markata-go.blogroll]
enabled = false

[markata-go.mentions]
enabled = false

[markata-go.tailwind]
build = false

[[markata-go.head.meta]]
name = "monetization"
content = "$ilp.uphold.com/MGN2ni2YMXaQ"
