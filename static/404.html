<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Rhiannon Walker</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('color-mode') === 'light' ? 'light' : 'dark'; } catch (_) {}</script>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/custom.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; font-family: "Literata", Georgia, serif; }
    .not-found-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; max-width: 72rem; margin: auto; padding: 1rem; }
    .not-found-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: end; gap: 1rem; }
    .not-found-nav a { color: var(--rw-cream); }
    .not-found-toggle { padding: .5rem .75rem; border: 1px solid var(--rw-line); border-radius: .5rem; background: var(--rw-plum); color: var(--rw-cream); cursor: pointer; }
    .not-found-main { width: min(100% - 2rem, 42rem); margin: clamp(3rem, 8vw, 8rem) auto; text-align: center; }
    .not-found-kicker { color: var(--rw-blush); font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(1.7rem, 4vw, 2.5rem); }
    h1 { margin: .25rem 0 1rem; color: var(--rw-cream); font-family: "Playwrite VN", "Cormorant Garamond", Georgia, serif; font-size: clamp(2.55rem, 6.4vw, 4.2rem); font-weight: 300; line-height: 1.3; letter-spacing: normal; font-kerning: normal; font-variant-ligatures: common-ligatures contextual; font-feature-settings: "calt" 1; }
    .not-found-main p { color: var(--rw-muted); font-size: 1.1rem; line-height: 1.7; }
    .not-found-main a { display: inline-block; margin-top: 1rem; padding: .75rem 1.25rem; border: 1px solid var(--rw-blush); border-radius: .5rem; }
    @media (max-width: 600px) { .not-found-header { flex-wrap: wrap; justify-content: center; } .not-found-nav { justify-content: center; } }
  </style>
</head>
<body>
  <header class="not-found-header">
    <a class="rhiannon-logo rhiannon-logo--compact" href="/" aria-label="Rhiannon Walker — home">
      <img class="rhiannon-logo__flowers" src="/images/rhiannon/flowers3-640.webp" alt="" width="640" height="427">
      <span class="rhiannon-logo__band"><span class="rhiannon-logo__name">Rhiannon</span></span>
    </a>
    <nav class="not-found-nav" aria-label="Main navigation">
      <a href="/">Home</a><a href="/about/">About</a><a href="/archive/">Archive</a><a href="/projects/">Projects</a>
      <button class="not-found-toggle" type="button" aria-label="Toggle dark and light mode">Light / dark</button>
    </nav>
  </header>
  <main class="not-found-main">
    <span class="not-found-kicker">A little lost?</span>
    <h1>Page not found</h1>
    <p>There isn't a page at this address. You can return home or browse the writing.</p>
    <a href="/">Return home</a>
  </main>
  <script>
    document.querySelector('.not-found-toggle').addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('color-mode', next); } catch (_) {}
    });
  </script>
</body>
</html>
